<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="form-container">
        <h2>Edit Product</h2>
        <form method="post">
            <label>Name:</label>
            <input type="text" name="name_product" value="{{ product.name_product }}">

            <label>Price:</label>
            <input type="number" step="0.01" name="price" value="{{ product.price }}">

            <label>Coverage:</label>
            <input type="text" name="coverage" value="{{ product.coverage }}">

            <label>Risk Level:</label>
            <input type="text" name="risk_level" value="{{ product.risk_level }}">

            <label>Company:</label>
            <input type="text" name="name_company" value="{{ product.name_company }}">

            <input type="submit" value="Save">
            <a href="/" class="button-link">← Back to product list</a>
        </form>
    </div>

</body>
</html>
