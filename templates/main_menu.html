<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-lg p-4 text-center" style="min-width: 400px;">
    <img src="/static/Veloriance.png" alt="Logo" class="logo">
    <h2 class="mb-4">🔍 Select Table to View</h2>
    <form method="post" action="/select_table">
        <div class="mb-3">
            <input type="text" id="table_name" name="table_name" class="form-control" placeholder="e.g. insurance products" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Go</button>
    </form>
</div>

</body>
</html>
