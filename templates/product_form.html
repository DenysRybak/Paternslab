<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if product %}Edit{% else %}Add{% endif %} Insurance Product</title>
</head>
<body>
    <h1>{% if product %}Edit{% else %}Add{% endif %} Insurance Product</h1>
    <form method="POST">
        <label for="name_product">Name:</label>
        <input type="text" id="name_product" name="name_product" value="{{ product.name_product if product else '' }}" required><br>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" value="{{ product.price if product else '' }}" required><br>

        <label for="coverage">Coverage:</label>
        <input type="text" id="coverage" name="coverage" value="{{ product.coverage if product else '' }}" required><br>

        <label for="risk_level">Risk Level (e.g., Low, Medium, High):</label>
        <input type="text" id="risk_level" name="risk_level" value="{{ product.risk_level if product else '' }}" required><br>

        <label for="name_company">Company:</label>
        <input type="text" id="name_company" name="name_company" value="{{ product.name_company if product else '' }}" required><br>

        <button type="submit">Submit</button>
    </form>
    <br>
    <a href="{{ url_for('insurance_products') }}">Back to Products</a>
</body>
</html>
